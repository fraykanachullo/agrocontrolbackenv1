; AgroControl - performance tuning (drvfs/9p bind-mount on Windows/WSL2)
; Bake method: docker/php-conf/99-app.ini copied to /usr/local/etc/php/conf.d/

; FrankenPHP web SAPI without an ini defaults max_execution_time to 30s;
; slow first-reads over the 9p mount used to exceed it and return 500.
max_execution_time = 120

; File reads over drvfs are ~7x slower than EXT4. Cache aggressively so
; per-request I/O stays in opcache shared memory instead of touching the mount.
realpath_cache_size = 128K
realpath_cache_ttl = 7200

opcache.enable = 1
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 80000
; No re-validation: after a deploy/restart, no per-request stat on the mount.
opcache.validate_timestamps = 0
opcache.fast_shutdown = 1

; Small timeouts are fine for the API; contextual waits stay bounded.
max_input_time = -1